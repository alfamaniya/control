name: Email offline HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest offline build
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send HTML through Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: a.mamghanian@isaco.ir
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          html_file = Path("dist/control-offline.html")
          if not html_file.is_file():
              raise SystemExit(f"Offline HTML file not found: {html_file}")

          sender = os.environ.get("GMAIL_USERNAME", "").strip()
          password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          recipient = os.environ.get("RECIPIENT", "").strip()

          if not sender or not password:
              raise SystemExit(
                  "Missing GitHub Actions secrets: GMAIL_USERNAME and/or GMAIL_APP_PASSWORD"
              )
          if not recipient or "@" not in recipient:
              raise SystemExit("Please provide a valid recipient email address.")

          message = EmailMessage()
          message["Subject"] = "نسخه آفلاین سامانه کنترل"
          message["From"] = sender
          message["To"] = recipient
          html_source = html_file.read_text(encoding="utf-8")
          message.set_content(
              "سلام،\n\n"
              "کد کامل نسخه آفلاین سامانه کنترل در ادامه همین متن ایمیل قرار گرفته است.\n"
              "برای استفاده، تمام کد را از ابتدا تا انتها در یک فایل با پسوند .html ذخیره کنید.\n\n"
              "========== شروع کد HTML سامانه کنترل ==========\n\n"
              + html_source
              + "\n\n========== پایان کد HTML سامانه کنترل =========="
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print(f"Email successfully sent to {recipient}")
          PY
