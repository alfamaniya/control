name: Email offline HTML

on:
  workflow_dispatch:
    inputs:
      recipient_choice:
        description: "گیرنده ایمیل را انتخاب کنید"
        required: true
        type: choice
        default: a.mamghanian@isaco.ir
        options:
          - a.mamghanian@isaco.ir
          - alfamaniya93@gmail.com
          - custom
      custom_recipient:
        description: "فقط اگر گزینه custom را انتخاب کردید، ایمیل دلخواه را وارد کنید"
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest offline build
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send HTML through Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_CHOICE: ${{ inputs.recipient_choice }}
          CUSTOM_RECIPIENT: ${{ inputs.custom_recipient }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          html_file = Path("dist/control-offline.html")
          if not html_file.is_file():
              raise SystemExit(f"Offline HTML file not found: {html_file}")

          sender = os.environ.get("GMAIL_USERNAME", "").strip()
          password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          recipient_choice = os.environ.get("RECIPIENT_CHOICE", "").strip()
          custom_recipient = os.environ.get("CUSTOM_RECIPIENT", "").strip()
          if recipient_choice == "custom":
              recipient = custom_recipient
          else:
              recipient = recipient_choice

          if not sender or not password:
              raise SystemExit(
                  "Missing GitHub Actions secrets: GMAIL_USERNAME and/or GMAIL_APP_PASSWORD"
              )
          if not recipient or "@" not in recipient or "." not in recipient.split("@")[-1]:
              raise SystemExit(
                  "گیرنده معتبر نیست؛ برای گزینه custom یک آدرس ایمیل معتبر وارد کنید."
              )

          message = EmailMessage()
          message["Subject"] = "نسخه آفلاین سامانه کنترل"
          message["From"] = sender
          message["To"] = recipient
          html_bytes = html_file.read_bytes()
          message.set_content(
              "سلام،\n\n"
              "فایل نسخه آفلاین سامانه کنترل به این ایمیل پیوست شده است.\n"
              "نام فایل پیوست control-offline.html.jpg است؛ محتوای آن HTML است، نه تصویر.\n"
              "برای اجرای آفلاین، پس از دریافت نام فایل را به control-offline.html تغییر دهید.\n"
          )
          message.add_attachment(
              html_bytes,
              maintype="application",
              subtype="octet-stream",
              filename="control-offline.html.jpg"
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print(f"Email successfully sent to {recipient}")
          PY
