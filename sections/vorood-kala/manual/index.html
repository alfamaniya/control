<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243d">
  <title>ورود دستی کالا</title>
  <link rel="stylesheet" href="../../../assets/css/style.css?v=20261106-3">
  <link rel="stylesheet" href="../../../components/sidebar/style.css?v=20261106-6">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">

  <script src="../../../assets/js/database.js?v=20261106-5" defer></script>
  <script src="script.js?v=20261106-4" defer></script>
  <script src="../../../components/sidebar/script.js?v=20261106-10" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle" type="button" aria-label="باز و بسته کردن منو" aria-controls="sidebar" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="../../../index.html">سامانه کنترل مصرف و ارسال کالا</a><div class="topbar-spacer"></div>
    </header>
    <div data-control-sidebar></div>
    <main class="main-content" id="mainContent">
      <div class="page-content goods-entry-subpage manual-entry-page">
        <a class="back-link" href="../index.html">بازگشت به ورود کالا</a>

        <section class="guide-box" aria-labelledby="manualGuideTitle">
          <div class="guide-icon" aria-hidden="true">i</div>
          <div class="guide-content">
            <h1 id="manualGuideTitle">راهنمای ثبت دستی کالا</h1>
            <p>کد ۱۰ رقمی، شرح، گروه و موجودی را وارد کنید؛ کد اختصاصی خودکار ساخته می‌شود.</p>
          </div>
        </section>

        <section class="import-panel manual-form-panel" aria-labelledby="manualFormTitle">
          <div class="panel-heading">
            <h2 id="manualFormTitle">اطلاعات کالا</h2>
          </div>
          <form class="manual-entry-form" id="manualEntryForm">
            <div class="manual-fields">
              <label class="manual-field" for="procurementCode">
                <span>کد تدارکاتی</span>
                <input id="procurementCode" name="procurementCode" type="text" inputmode="numeric" maxlength="10" placeholder="۱۰ رقم" autocomplete="off">
              </label>
              <label class="manual-field" for="productDescription">
                <span>شرح کالا</span>
                <input id="productDescription" name="description" type="text" placeholder="شرح کالا" autocomplete="off">
              </label>
              <label class="manual-field" for="productGroup">
                <span>گروه کالا</span>
                <input id="productGroup" name="group" type="text" placeholder="گروه کالا" autocomplete="off">
              </label>
              <label class="manual-field" for="productQuantity">
                <span>تعداد موجودی</span>
                <input id="productQuantity" name="quantity" type="number" min="0" step="1" placeholder="تعداد">
              </label>
            </div>
            <div class="manual-form-actions"><button class="primary-button" id="submitManualEntry" type="submit">تأیید و ورود کالا</button></div>
          </form>
          <div class="manual-entry-message" id="manualEntryMessage" role="status" aria-live="polite" hidden></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
