<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243d">
  <title>گزارش بر اساس تاریخ</title>
  <link rel="stylesheet" href="../../../assets/css/style.css?v=20261105-3">
  <link rel="stylesheet" href="../../../components/sidebar/style.css?v=20261105-3">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../../assets/js/jalali-calendar.js" defer></script>
  <script src="script.js" defer></script>
  <script src="../../../components/sidebar/script.js?v=20261105-2" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle" type="button" aria-label="باز و بسته کردن منو" aria-controls="sidebar" aria-expanded="true"><span></span><span></span><span></span></button>
      <a class="brand" href="../../../index.html">سامانه کنترل مصرف و ارسال کالا</a>
      <div class="topbar-spacer"></div>
    </header>
    <div data-control-sidebar></div>
    <main class="main-content" id="mainContent">
      <div class="page-content report-subpage">
        <a class="back-link" href="../index.html">بازگشت به گزارش‌ها</a>
        <section class="report-subpage-panel">
          <span class="report-subpage-icon">▦</span>
          <div>
            <span class="report-eyebrow">بخش گزارش‌ها</span>
            <h1>گزارش بر اساس تاریخ</h1>
            <p>تهیه و مشاهده گزارش‌ها بر پایه بازه زمانی شمسی.</p>
          </div>
        </section>
        <section class="date-range-card" aria-labelledby="dateRangeTitle">
          <div class="date-range-card-head">
            <h2 id="dateRangeTitle">انتخاب بازه زمانی</h2>
            <p>تاریخ شروع و پایان گزارش را مشخص کنید.</p>
          </div>
          <div class="date-range-fields">
            <div class="date-field">
              <label for="reportStartDate">از تاریخ</label>
              <input id="reportStartDate" name="startDate" type="text" data-jalali-calendar placeholder="انتخاب تاریخ شروع" readonly autocomplete="off">
            </div>
            <div class="date-field">
              <label for="reportEndDate">تا تاریخ</label>
              <input id="reportEndDate" name="endDate" type="text" data-jalali-calendar placeholder="انتخاب تاریخ پایان" readonly autocomplete="off">
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
