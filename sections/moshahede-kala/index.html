<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243d">
  <title>مشاهده کالاها و موجودی</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261106-3">
  <link rel="stylesheet" href="../../components/sidebar/style.css?v=20261106-6">
  <link rel="stylesheet" href="style.css?v=20261106-1">

  <script src="../../assets/js/database.js" defer></script>
  <script src="../../assets/js/table-sort.js" defer></script>
  <script src="script.js?v=20261106-2" defer></script>
  <script src="../../components/sidebar/script.js?v=20261106-10" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle" type="button" aria-label="باز و بسته کردن منو" aria-controls="sidebar" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="../../index.html">سامانه کنترل مصرف و ارسال کالا</a>
      <div class="topbar-spacer"></div>
    </header>
    <div data-control-sidebar></div>
    <main class="main-content" id="mainContent">
      <div class="page-content inventory-page">
        <section class="inventory-heading">
          <div>
            <h1>مشاهده کالاها و موجودی</h1>
            <p>فهرست کامل کالاهای ثبت‌شده در موجودی سامانه</p>
          </div>
        </section>
        <section class="inventory-panel" aria-label="فهرست کل موجودی">
          <div class="inventory-panel-heading">
            <div><h2>کل موجودی</h2><p>اطلاعات کالاهای ذخیره‌شده در پایگاه داده محلی</p></div>
            <div class="inventory-panel-actions">
              <div class="inventory-total"><strong id="inventoryCount">۰</strong><span>قلم کالا</span></div>
              <button type="button" class="refresh-button" id="refreshInventory">↻ <span>بروزرسانی فهرست</span></button>
            </div>
          </div>
          <div id="inventoryMessage" class="inventory-message" role="status" aria-live="polite">در حال دریافت اطلاعات موجودی…</div>
          <div class="inventory-table-wrap" id="inventoryTableWrap" hidden>
            <table class="inventory-table">
              <thead><tr><th>ردیف</th><th>کد اختصاصی</th><th>کد تدارکاتی</th><th>شرح کالا</th><th>گروه کالا</th><th>تعداد موجودی</th></tr></thead>
              <tbody id="inventoryRows"></tbody>
            </table>
          </div>
          <nav class="inventory-pagination" id="inventoryPagination" aria-label="صفحه‌بندی فهرست موجودی" hidden>
            <button type="button" id="inventoryPrev" class="page-button" disabled><span class="page-button-icon" aria-hidden="true">›</span><span>قبلی</span></button>
            <div class="page-picker">
              <label for="inventoryPageSelect">صفحه</label>
              <select id="inventoryPageSelect" aria-label="انتخاب شماره صفحه"></select>
              <span id="inventoryPageSummary" aria-live="polite"></span>
            </div>
            <button type="button" id="inventoryNext" class="page-button"><span>بعدی</span><span class="page-button-icon" aria-hidden="true">‹</span></button>
          </nav>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
