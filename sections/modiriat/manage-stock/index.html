<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243d">
  <title>مدیریت موجودی کالاها</title>
  <link rel="stylesheet" href="../../../assets/css/style.css">
  <link rel="stylesheet" href="../../../components/sidebar/style.css">
  <link rel="stylesheet" href="style.css">

  <script src="../../../assets/js/database.js" defer></script>
  <script src="script.js" defer></script>
  <script src="../../../components/sidebar/script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle" type="button" aria-label="باز و بسته کردن منو" aria-controls="sidebar" aria-expanded="true">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="../../../index.html">نام سایت</a>
      <div class="topbar-spacer"></div>
    </header>
    <div data-control-sidebar></div>
    <main class="main-content" id="mainContent">
      <div class="page-content modiriat-page">
        <section class="management-heading"><div><span class="management-eyebrow">تنظیمات و مدیریت</span><h1>مدیریت موجودی کالاها</h1><p>بررسی و اصلاح تعداد موجودی کالا</p></div></section>
        <section class="management-panel stock-management-panel" id="manage-stock" aria-labelledby="manageStockTitle">
          <div class="management-panel-heading">
            <div><h2 id="manageStockTitle">مدیریت موجودی کالاها</h2><p>کالا را جست‌وجو کنید و تعداد موجودی جدید آن را ثبت کنید.</p></div>
          </div>
          <label class="search-label" for="stockProductSearch">جست‌وجوی کالا</label>
          <div class="management-search-wrap"><span class="search-symbol" aria-hidden="true">⌕</span><input id="stockProductSearch" class="management-search" type="search" autocomplete="off" placeholder="کد اختصاصی، کد تدارکاتی یا شرح کالا…"></div>
          <div id="stockSearchResults" class="product-results stock-search-results" aria-live="polite"></div>
          <div id="stockSelectedCard" class="stock-selected-card" hidden>
            <div class="stock-selected-info"><strong id="stockSelectedDescription"></strong><span id="stockSelectedCodes"></span><span>موجودی فعلی: <b id="stockCurrentQuantity"></b></span></div>
            <form id="stockAdjustmentForm" class="stock-adjustment-form">
              <div class="stock-quantity-field"><label for="newStockQuantity">موجودی جدید</label><input id="newStockQuantity" type="number" min="0" step="1" inputmode="numeric" required placeholder="تعداد نهایی موجودی"></div>
              <button class="stock-save-button" type="submit">ثبت تعدیل موجودی</button>
            </form>
            <p class="stock-operation-hint">افزایش موجودی با عنوان «تعدیل مثبت» و کاهش موجودی با عنوان «تعدیل منفی» در کاردکس ثبت می‌شود.</p>
          </div>
          <div id="stockAdjustmentMessage" class="management-message" role="status" aria-live="polite" hidden></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
